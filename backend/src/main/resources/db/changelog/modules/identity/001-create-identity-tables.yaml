# identity module - schema
#
# Owns the tenant root (organisation) and the login record (app_user).
#
# The table is `app_user`, not `user`: USER is a reserved word in PostgreSQL and
# would have to be quoted at every use site. This is the only place a table name
# departs from the entity name.
databaseChangeLog:
  - changeSet:
      id: identity-001-create-organisation
      author: mission-control
      comment: Tenant root. Every tenant-owned row in every module points at one of these.
      changes:
        - createTable:
            tableName: organisation
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_organisation
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: identity-002-create-app-user
      author: mission-control
      comment: >-
        An account that can log in. role and status are stored as the integer codes
        pinned in docs/data-model.md; the check constraints stop an out-of-range
        code being written, which would silently mean nothing on read.
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_user
                    nullable: false
              - column:
                  name: organisation_id
                  type: UUID
                  constraints:
                    nullable: false
                    # Same module, so a real foreign key is correct here.
                    foreignKeyName: fk_app_user_organisation
                    references: organisation(id)
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: tokens_valid_from
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: identity-003-app-user-email-unique
      author: mission-control
      comment: >-
        Invariant I1 - email is unique system-wide, case-insensitively. A functional
        index on LOWER(email) enforces it in the database rather than in application
        code, so two concurrent inserts cannot both win. Email keeps its original
        casing for display.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ux_app_user_email_lower ON app_user (LOWER(email))
      rollback:
        - sql:
            sql: DROP INDEX ux_app_user_email_lower

  - changeSet:
      id: identity-004-app-user-enum-checks
      author: mission-control
      comment: >-
        UserRole 1..3 and UserStatus 1..2, per the pinned codes. addCheckConstraint
        is a Liquibase Pro feature, so these are raw SQL.
      changes:
        - sql:
            sql: ALTER TABLE app_user ADD CONSTRAINT ck_app_user_role CHECK (role BETWEEN 1 AND 3)
        - sql:
            sql: ALTER TABLE app_user ADD CONSTRAINT ck_app_user_status CHECK (status BETWEEN 1 AND 2)
      rollback:
        - sql:
            sql: ALTER TABLE app_user DROP CONSTRAINT ck_app_user_role
        - sql:
            sql: ALTER TABLE app_user DROP CONSTRAINT ck_app_user_status

  - changeSet:
      id: identity-005-app-user-organisation-index
      author: mission-control
      comment: Every query is filtered by organisation (T1), so this index is on the hot path.
      changes:
        - createIndex:
            tableName: app_user
            indexName: ix_app_user_organisation
            columns:
              - column:
                  name: organisation_id
