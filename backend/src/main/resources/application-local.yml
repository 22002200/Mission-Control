# Active when running the backend on the host (e.g. from IntelliJ) against a
# Dockerised Postgres published on localhost:5432.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:missioncontrol}

logging:
  level:
    com.missioncontrol: DEBUG
    org.springframework.web: INFO
