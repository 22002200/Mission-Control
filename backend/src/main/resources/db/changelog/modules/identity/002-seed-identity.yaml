# identity module - seed data
#
# Two organisations, each with a director, two mission leads and a crew roster.
# Two rather than one because a single-tenant dataset cannot demonstrate T2.
#
# Every seeded id is a fixed, readable UUID rather than a generated one:
#   a0.. / b0..  organisation      a1.. / b1..  app_user
#   a2.. / b2..  skill             a3.. / b3..  crew_member
# The leading nibble is the organisation. Fixed ids make the seed idempotent and
# let other modules reference these rows without caring what order Liquibase runs
# the module changelogs in - which matters, because `includeAll` orders them
# alphabetically (crew, identity, skill), not by dependency. That is safe only
# because architecture.md forbids foreign keys across module boundaries.
#
# All seeded users share the password `Password123!`. The hash below is BCrypt,
# cost 10, $2a$ - the defaults Spring Security's BCryptPasswordEncoder produces.
#
# contextFilter: seed keeps this out of any run that does not ask for it. See
# spring.liquibase.contexts in application.yml.
databaseChangeLog:
  - changeSet:
      id: identity-seed-001-organisations
      author: mission-control
      contextFilter: seed
      comment: Two tenants, so cross-tenant isolation can be tested rather than assumed.
      changes:
        - sql:
            sql: |
              INSERT INTO organisation (id, name, created_at) VALUES
                ('a0000000-0000-0000-0000-000000000001', 'Orbital Dynamics', '2026-01-05 09:00:00+00'),
                ('b0000000-0000-0000-0000-000000000001', 'Helios Aerospace', '2026-01-05 09:00:00+00');
      rollback:
        - sql:
            sql: DELETE FROM organisation WHERE id IN ('a0000000-0000-0000-0000-000000000001', 'b0000000-0000-0000-0000-000000000001');

  - changeSet:
      id: identity-seed-002-users
      author: mission-control
      contextFilter: seed
      comment: >-
        role: 1 DIRECTOR, 2 MISSION_LEAD, 3 CREW_MEMBER. status: 1 ACTIVE.
        Orbital Dynamics has 8 crew, Helios 6 - both above the 6 the spec asks for
        on at least one tenant, and different sizes so a hard-coded count in a test
        fails loudly.
