# crew module - seed data
#
# One CrewMember per CREW_MEMBER user, plus 2-4 rated skills each.
#
# The Orbital Dynamics roster is built so the worked example in
# docs/features/06-crew-matching.md reproduces exactly against seed data. For a
# requirement of EVA Operations (mandatory, min 3) + Robotics (preferred, min 4):
#
#   Ada Kowalski   EVA 3, Robotics 4   fit 1.00 / met 1.00  -> 1.00   ranked first
#   Chen Ibarra    EVA 3, Robotics 2   fit 1.00 / met 0.50  -> 0.75
#   Bruno Sato     EVA 5, Robotics 4   fit 0.00 / met 1.00  -> 0.50   over-qualified
#   Dana Osei      EVA 2               below the minimum    -> excluded
#
# Nobody else on the roster holds EVA Operations, so those four are the whole
# candidate set. With no missions or assignments seeded, the experience and load
# terms are both zero, so score equals skillScore and the example holds exactly.
#
# Changing an EVA or Robotics proficiency here will break that example. The rest
# of the roster is free to change.
databaseChangeLog:
  - changeSet:
      id: crew-seed-001-crew-members
      author: mission-control
      contextFilter: seed
      comment: One profile per crew user. user_id references identity, deliberately without a foreign key.
