# mission module - seed data
#
# Enough missions to fill all three sections of the mission board on first login,
# spread across every status so each one can be seen without having to build it.
# Split between both mission leads in each organisation, so a director's view is
# visibly wider than either lead's - which is the whole of FR-2 made demonstrable.
#
# Dates are anchored to the same 2026-01-05 09:00:00+00 the rest of the seed uses,
# never now(). A seed whose meaning drifts with the wall clock cannot be asserted
# against (feature 01, NFR-5).
#
# No assignments are seeded, because that module does not exist yet. Every mission
# therefore reads as unstaffed, and the two ACTIVE ones were put there directly
# rather than started through the API - which is honest: with nobody able to
# accept a place, POST /start cannot succeed. It also leaves feature 06's worked
# example untouched, since that depends on crew load and there is none.
databaseChangeLog:
