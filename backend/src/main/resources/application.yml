spring:
  application:
    name: mission-control

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/missioncontrol}
    username: ${DB_USERNAME:missioncontrol}
    password: ${DB_PASSWORD:missioncontrol}

  jpa:
    # Liquibase owns the schema. Hibernate only ever checks that the mapping matches;
    # it must never be allowed to create or alter tables.
    hibernate:
      ddl-auto: validate
    # Off by default: lazy loading in the view layer hides N+1 queries and blurs the
    # transaction boundary each module is responsible for.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Schema changesets carry no context and always run. Demo data is tagged
    # `seed` and runs only when `seed` is an active context, which the local and
    # docker profiles switch on. A deployment that leaves this at the default
    # gets the schema and none of the fictional organisations.
    contexts: ${LIQUIBASE_CONTEXTS:default}

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow. Widen consciously, and only behind authentication.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

missioncontrol:
  # spring-boot-starter-parent filters application*.yml with @...@ delimiters, so
  # Maven substitutes the real project version here at build time. If you ever see
  # the literal placeholder in a response, the resources were not processed by Maven.
  version: '@project.version@'

  cors:
    allowed-origins: http://localhost:5173

  # Crew matching scoring constants - feature 06, NFR-6. These encode a judgement
  # about how an organisation trades experience against availability, and a
  # judgement nobody can change without a rebuild is not one anybody revisits.
  matching:
    # Skill fit spans a full 0 to 1; both caps below are deliberately a third of
    # that, so closeness of fit stays the dominant signal and these stay secondary.
    experience-bonus-per-mission: 0.1
    experience-bonus-cap: 0.3
    load-penalty-per-assignment: 0.05
    # A positive magnitude. It is subtracted at the point of use - a negative
    # number here that then gets subtracted reads correctly and behaves backwards.
    load-penalty-cap: 0.3
    # How many median missions of history still count as recent load. A window one
    # mission long would find almost nobody loaded, and a penalty that never fires
    # is a term that has quietly stopped participating in the ranking. Six reads as
    # roughly the last half-dozen missions' worth of time.
    load-window-multiplier: 6
    # Only for an organisation that has completed no missions and so has no median
    # to scale to. Every other organisation is measured on its own timescale.
    default-load-window: P365D
    default-limit: 3
    max-limit: 10
    max-excluded: 50

  security:
    jwt:
      issuer: mission-control
      audience: mission-control-web
      # Eight hours, and no refresh token: the user logs in again. Long enough for
      # a working day, short enough that a leaked token is not indefinite.
      access-token-ttl: PT8H
      # Deliberately has no fallback. A signing key compiled into the build is a
      # signing key handed to everyone who can read the build, so this comes from
      # the environment or the application refuses to start. See .env.example.
      secret: ${JWT_SECRET:}

logging:
  level:
    com.missioncontrol: INFO
    # Security internals log tokens and principals at DEBUG. Pinned at INFO so a
    # broad debug setting elsewhere cannot start writing credentials to the log.
    org.springframework.security: INFO
