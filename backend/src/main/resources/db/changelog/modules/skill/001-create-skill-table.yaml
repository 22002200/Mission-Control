# skill module - schema
#
# The org-scoped skill catalogue. Crew rate these and mission requirements ask
# for them, so matching compares ids rather than strings.
#
# organisation_id carries no foreign key: organisation belongs to the identity
# module, and architecture.md forbids foreign keys across module boundaries.
databaseChangeLog:
  - changeSet:
      id: skill-001-create-skill
      author: mission-control
      comment: >-
        Skills are never deleted (invariant S2) - `active` retires one while leaving
        every CrewSkill and RequiredSkill that references it readable.
      changes:
        - createTable:
            tableName: skill
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_skill
                    nullable: false
              - column:
                  name: organisation_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: skill-002-skill-name-unique-per-organisation
      author: mission-control
      comment: >-
        Invariant S1 - (organisationId, name) unique, case-insensitive. Scoping the
        index by organisation is what lets two tenants both define "EVA Operations"
        as separate rows.
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ux_skill_organisation_name_lower ON skill (organisation_id, LOWER(name))
      rollback:
        - sql:
            sql: DROP INDEX ux_skill_organisation_name_lower
