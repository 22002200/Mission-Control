# skill module - seed data
#
# Both catalogues deliberately share several names - EVA Operations, Robotics,
# Life Support Systems, Flight Navigation, Medical Response - as separate rows
# with separate ids. That is what demonstrates invariant S1: uniqueness is scoped
# to the organisation, so two tenants can use the same vocabulary without sharing
# a single row.
#
# Helios additionally has Solar Array Maintenance, which Orbital Dynamics does
# not, so the catalogues are not merely mirror images.
databaseChangeLog:
  - changeSet:
      id: skill-seed-001-catalogue
      author: mission-control
      contextFilter: seed
      comment: 8 skills for Orbital Dynamics, 6 for Helios Aerospace. All active.
